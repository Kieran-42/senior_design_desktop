controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: True

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # Leg controllers - rear right
    rear_right_leg_controller:
      type: position_controllers/JointGroupPositionController

    # Leg controllers - rear left
    rear_left_leg_controller:
      type: position_controllers/JointGroupPositionController

    # Leg controllers - front right
    front_right_leg_controller:
      type: position_controllers/JointGroupPositionController

    # Leg controllers - front left
    front_left_leg_controller:
      type: position_controllers/JointGroupPositionController



rear_right_leg_controller:
  ros__parameters:
    joints:
      - rear_right_base_hip_joint
      - rear_right_hip_1_hip_2_joint
      - rear_right_tibia_paw_joint
    interface_name: position

rear_left_leg_controller:
  ros__parameters:
    joints:
      - rear_left_base_hip_joint
      - rear_left_hip_1_hip_2_joint
      - rear_left_tibia_paw_joint
    interface_name: position

front_right_leg_controller:
  ros__parameters:
    joints:
      - front_right_base_hip_joint
      - front_right_hip_1_hip_2_joint
      - front_right_tibia_paw_joint
    interface_name: position

front_left_leg_controller:
  ros__parameters:
    joints:
      - front_left_base_hip_joint
      - front_left_hip_1_hip_2_joint
      - front_left_tibia_paw_joint
    interface_name: position

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["rear_left_paw_wheel_joint", "front_left_paw_wheel_joint"]
    right_wheel_names: ["rear_right_paw_wheel_joint", "front_right_paw_wheel_joint"]
    wheel_separation: 0.3
    wheel_radius: 0.05

    odom_frame_id: "odom"
    base_frame_id: "base_link"

    enable_odom_tf: true
    publish_rate: 50.0
    linear:
      x:
        max_velocity: 1.0
        min_velocity: -1.0
